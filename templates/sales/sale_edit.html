{% extends 'base_admin.html' %}
{% block title %}Edit Sale{% endblock %}
{% block page_title %}Edit Sale{% endblock %}
{% block content %}
<div class="max-w-lg">
  <div class="mb-4">
    <a href="{% url 'sale_detail' sale.pk %}"
       class="inline-flex items-center gap-2 text-sm font-medium text-gray-500 hover:text-primary-700 transition-colors">
      <i class="fas fa-arrow-left text-xs"></i> Back to Sale
    </a>
  </div>

  <div class="bg-white rounded-2xl border border-sage-200 overflow-hidden">
    <div class="h-1" style="background:linear-gradient(90deg,#16a34a,#4ade80,#86efac)"></div>
    <div class="p-6">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:linear-gradient(135deg,#dcfce7,#bbf7d0)">
          <i class="fas fa-pen text-primary-600 text-sm"></i>
        </div>
        <div>
          <h2 class="font-bold text-gray-800">Edit Sale</h2>
          <p class="text-xs text-gray-400 font-mono">{{ sale.invoice_number }}</p>
        </div>
      </div>

      <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Status</label>
          <select name="status" class="w-full border border-sage-200 rounded-xl px-4 py-2.5 text-sm bg-sage-50 focus:outline-none text-gray-700">
            <option value="pending" {% if sale.status == 'pending' %}selected{% endif %}>Pending</option>
            <option value="completed" {% if sale.status == 'completed' %}selected{% endif %}>Completed</option>
            <option value="cancelled" {% if sale.status == 'cancelled' %}selected{% endif %}>Cancelled</option>
            <option value="refunded" {% if sale.status == 'refunded' %}selected{% endif %}>Refunded</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Payment Method</label>
          <select name="payment_method" class="w-full border border-sage-200 rounded-xl px-4 py-2.5 text-sm bg-sage-50 focus:outline-none text-gray-700">
            <option value="cash" {% if sale.payment_method == 'cash' %}selected{% endif %}>Cash</option>
            <option value="card" {% if sale.payment_method == 'card' %}selected{% endif %}>Card</option>
            <option value="transfer" {% if sale.payment_method == 'transfer' %}selected{% endif %}>Bank Transfer</option>
            <option value="pos" {% if sale.payment_method == 'pos' %}selected{% endif %}>POS</option>
            <option value="online" {% if sale.payment_method == 'online' %}selected{% endif %}>Online Payment</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Discount Amount (₦)</label>
          <input type="number" name="discount_amount" value="{{ sale.discount_amount }}" min="0" step="0.01"
                 class="w-full border border-sage-200 rounded-xl px-4 py-2.5 text-sm bg-sage-50 focus:outline-none text-gray-700">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Notes</label>
          <textarea name="notes" rows="3"
                    class="w-full border border-sage-200 rounded-xl px-4 py-2.5 text-sm bg-sage-50 focus:outline-none text-gray-700 resize-none">{{ sale.notes }}</textarea>
        </div>
        <div class="flex gap-3 pt-2">
          <button type="submit"
                  class="flex-1 text-white py-2.5 rounded-xl text-sm font-semibold transition-all hover:opacity-90"
                  style="background:linear-gradient(135deg,#16a34a,#14532d)">
            Save Changes
          </button>
          <a href="{% url 'sale_detail' sale.pk %}"
             class="flex-1 text-center py-2.5 rounded-xl text-sm font-semibold bg-sage-100 text-gray-600 hover:bg-sage-200 transition-colors">
            Cancel
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
